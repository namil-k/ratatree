[package]
name = "ratatree"
version = "0.2.1"
edition = "2021"
rust-version = "1.88"
description = "A terminal file/directory picker widget for ratatui"
license = "MIT"
repository = "https://github.com/namil-k/ratatree"
homepage = "https://github.com/namil-k/ratatree"
documentation = "https://docs.rs/ratatree"
readme = "README.md"
keywords = ["tui", "ratatui", "file-picker", "directory", "widget"]
categories = ["command-line-interface"]
exclude = ["docs/", ".superpowers/", ".github/", ".git-blame-ignore-revs"]

[dependencies]
# The crossterm feature is what re-exports `ratatui::crossterm`, which this
# crate's public API is built on. Depending on crossterm directly would let an
# application's crossterm version drift from ratatui's, making the `Event` type
# in `handle_event` incompatible with the one the application constructs.
ratatui = { version = "0.30", features = ["crossterm"] }
dirs = "7"

[dev-dependencies]
tempfile = "3"

[[example]]
name = "basic"
path = "examples/basic.rs"
