name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      # Plain `cargo test` rather than `--all-targets`, which would skip the
      # doctests. Symlink tests are #[cfg(unix)] and simply do not build on
      # Windows, which is why that runner is worth having.
      - run: cargo test --locked

  lint:
    name: fmt, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Catches broken intra-doc links and any public item that lost its
      # documentation, which #![warn(missing_docs)] reports but does not fail on.
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: build on the declared MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep this in step with rust-version in Cargo.toml.
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --locked --all-targets

  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo package --locked
